<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>命理排盘 · 八字 + 紫微</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div class="page">

    <!-- 输入区（共享） -->
    <div class="input-panel" id="input-panel">
      <div class="input-summary" id="input-summary" onclick="toggleInputEdit()">
        <span class="input-summary-text" id="input-summary-text"></span>
        <span class="input-edit-icon">✎</span>
      </div>
      <label>年
        <input id="in-year" type="number" min="1900" max="2100" value="1991" placeholder="1991">
      </label>
      <label>月
        <input id="in-month" type="number" min="1" max="12" value="9" placeholder="9">
      </label>
      <label>日
        <input id="in-day" type="number" min="1" max="31" value="23" placeholder="23">
      </label>
      <label>时
        <input id="in-hour" type="number" min="0" max="23" value="16" placeholder="16">
      </label>
      <label>分
        <input id="in-minute" type="number" min="0" max="59" value="30" placeholder="30">
      </label>
      <label>城市
        <input id="in-city" list="city-list" value="常州" placeholder="输入城市">
        <datalist id="city-list"></datalist>
      </label>
      <label>性别
        <select id="in-gender">
          <option value="0">女（坤造）</option>
          <option value="1">男（乾造）</option>
        </select>
      </label>
      <button onclick="doPaipanAll()">排盘</button>
      <button onclick="saveChart()">保存命例</button>
      <button onclick="toggleChartList()">切换命例</button>
      <button id="login-btn" class="login-btn" onclick="toggleSupabaseAuth()">登录 GitHub</button>
    </div>

    <!-- 命例列表（点击「切换命例」弹出） -->
    <div class="chart-list-panel" id="chart-list-panel" style="display:none">
      <div class="chart-list-header">
        <span class="chart-list-title">命例列表</span>
        <span class="chart-list-count" id="chart-count"></span>
        <span class="chart-list-actions">
          <button onclick="uploadAllChartsToCloud()">上传云端</button>
          <button onclick="exportCharts()">导出 JSON</button>
          <button onclick="document.getElementById('import-file').click()">导入 JSON</button>
          <input type="file" id="import-file" accept=".json" style="display:none" onchange="importCharts(this)">
        </span>
      </div>
      <div id="chart-list"></div>
    </div>

    <!-- 排盘 + 题目/批注（大屏左右，小屏上下） -->
    <div class="content-layout" id="content-layout">
      <div class="quiz-layout" id="quiz-layout">
      <div class="board-slot">
        <!-- 八字/紫微 Tab（排盘面板内，一级切换） -->
        <div class="tab-bar">
          <button class="tab active" data-tab="bazi" onclick="switchTab('bazi')">八字</button>
          <button class="tab" data-tab="ziwei" onclick="switchTab('ziwei')">紫微</button>
        </div>
        <!-- 八字排盘表 -->
        <div class="chart-card" id="bazi-board">
          <div class="bazi-view-switch">
            <button class="view-btn active" data-view="yuanju" onclick="switchBaziView('yuanju')">原局</button>
            <button class="view-btn" data-view="liunian" onclick="switchBaziView('liunian')">流年大运</button>
            <button class="view-btn" data-view="today" onclick="goToday()">当前年月</button>
          </div>
          <div class="chart-scale-wrap" id="chart-scale-wrap">
            <div class="chart">
              <div class="col col-label" id="col-label-left"></div>
              <div class="col col-pillar" id="col-year"></div>
              <div class="col col-pillar" id="col-month"></div>
              <div class="col col-pillar" id="col-day"></div>
              <div class="col col-pillar" id="col-time"></div>
            </div>
          </div>
        </div>
        <!-- 紫微盘 -->
        <div class="board-wrap" id="ziwei-board" style="display:none">
          <div class="palace-grid" id="palace-grid"></div>
        </div>
      </div>
      <div class="quiz-questions" id="quiz-questions"></div>
    </div>

      <!-- 批注（一直在，不随 tab 消失） -->
      <div class="batch-note" id="batch-note"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lunar.js"></script>
  <script src="cities.js"></script>
  <script src="shensha.js"></script>
  <script src="quiz-bank.js"></script>
  <script src="iztro.min.js"></script>
  <script src="glossary.js?v=4"></script>
  <script src="bazi.js?v=13"></script>
  <script src="ziwei.js?v=8"></script>
  <button id="gather-toggle" class="gather-toggle" onclick="toggleGatherMode()">拾词</button>

  <script>
    /* 共享排盘：同时排八字和紫微 */
    function doPaipanAll() {
      baziPaipan();
      ziweiPaipan();
    }
    /* Tab 切换：只切排盘区，题目和批注一直在 */
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(function (t) {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      document.getElementById('bazi-board').style.display = (tab === 'bazi') ? 'block' : 'none';
      document.getElementById('ziwei-board').style.display = (tab === 'ziwei') ? 'block' : 'none';
      if (tab === 'bazi') baziRelayoutArcs();
      if (tab === 'ziwei') ziweiRelayout();
    }
  </script>
</body>
</html>
